<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="margin:0;background:#ffffff">
<div style="max-width:480px;margin:0 auto;padding:24px 16px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5;color:#1f2937">
<p style="margin:0 0 24px">{{intro}}</p>
<p style="margin:0 0 24px"><a href="{{link}}" style="display:inline-block;padding:12px 24px;border-radius:10px;background:#299d91;color:#ffffff;text-decoration:none;font-weight:bold">{{button}}</a></p>
<p style="margin:0 0 16px;font-size:14px;color:#6b7280">{{outro}}</p>
<p style="margin:0;font-size:13px;color:#6b7280;word-break:break-all">{{linkFallback}}<br>{{link}}</p>
</div>
</body>
</html>
