<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="margin:0;background:#ffffff">
<div style="max-width:480px;margin:0 auto;padding:24px 16px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5;color:#1f2937">
<p style="margin:0 0 8px">{{hello}}</p>
<h1 style="margin:0 0 16px;font-size:22px;line-height:1.3">{{monthName}}</h1>
<table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin:0 0 24px">
<tr><td style="padding:4px 0">{{income}}</td><td style="padding:4px 0 4px 8px;text-align:right;white-space:nowrap;font-weight:bold;color:#299d91">{{incomeAmount}}</td></tr>
<tr><td style="padding:4px 0">{{expenses}}</td><td style="padding:4px 0 4px 8px;text-align:right;white-space:nowrap;font-weight:bold">{{expenseAmount}}</td></tr>
<tr><td style="padding:4px 0">{{balance}}</td><td style="padding:4px 0 4px 8px;text-align:right;white-space:nowrap;font-weight:bold;color:{{balanceColor}}">{{balanceAmount}}</td></tr>
</table>
<table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin:0 0 24px;font-size:15px">
<tr>
<th style="padding:0 0 8px;text-align:left;font-size:13px;font-weight:normal;color:#6b7280">{{category}}</th>
<th style="padding:0 0 8px 8px;text-align:right;font-size:13px;font-weight:normal;color:#6b7280">{{goal}}</th>
<th style="padding:0 0 8px 8px;text-align:right;font-size:13px;font-weight:normal;color:#6b7280">{{spent}}</th>
</tr>
{{{rows}}}
</table>
<p style="margin:0 0 24px"><a href="{{link}}" style="display:inline-block;padding:12px 24px;border-radius:10px;background:#299d91;color:#ffffff;text-decoration:none;font-weight:bold">{{button}}</a></p>
<p style="margin:0;font-size:13px;color:#6b7280">{{outro}} <a href="{{profileLink}}" style="color:#299d91">{{profile}}</a>.</p>
</div>
</body>
</html>
